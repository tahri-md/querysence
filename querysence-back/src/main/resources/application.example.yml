spring:
  application:
    name: QuerySense

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/querysence}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/querysence/protocol/openid-connect/certs}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/querysence}
    username: ${SPRING_DATASOURCE_USERNAME:amine}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    # ONLY enable the AI model types QuerySense actually uses
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    # Chat → Groq
    openai:
      chat:
        api-key: ${GROQ_API_KEY}
        base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: ${GROQ_TEMPERATURE:0.2}

      # Embeddings → OpenAI
      embedding:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    # Pinecone
    vectorstore:
      pinecone:
        api-key: ${PINECONE_API_KEY}
        index-name: ${PINECONE_INDEX_NAME}
        namespace: ${PINECONE_NAMESPACE}

rag:
  retrieval:
    top-k: 3  # Number of similar queries to retrieve
    similarity-threshold: 0.7

  storage:
    min-score-to-store: 0.8  # Only store if confidence > 80%
    max-history: 10000
# AI Rate Limiting
ai:
  rate-limit:
    daily-requests: ${AI_DAILY_LIMIT:100}

# Database encryption
environment:
  DB_CONNECTION_ENCRYPTION_KEY: ${DB_CONNECTION_ENCRYPTION_KEY}

# Server Configuration
server:
  port: ${PORT:8081}

# Logging
logging:
  level:
    root: INFO
    com.querysense: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE