services:
  postgres:
    image: postgres:16
    container_name: querysence-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: querysence
      POSTGRES_USER: amine
      POSTGRES_PASSWORD: amine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amine -d querysence"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./querysence-back
      dockerfile: Dockerfile
    container_name: querysence-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/querysence
      SPRING_DATASOURCE_USERNAME: amine
      SPRING_DATASOURCE_PASSWORD: amine
      DB_CONNECTION_ENCRYPTION_KEY: Pim+0qm/OPIvub88KQ2VIUKUimorRxedU51o36w90yk= 
    ports:
      - "8082:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # frontend:
  #   build:
  #     context: ./querysence-front
  #     dockerfile: Dockerfile
  #   container_name: querysence-frontend
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8082
  #   ports:
  #     - "3000:3000"

volumes:
  pgdata:
